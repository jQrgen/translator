[project]
name = "translate-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "qrcode>=8.2",
    "telethon>=1.45.0",
]

[project.scripts]
translate-bot = "translate_bot.__main__:main"

[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "translate_bot"
module-root = ""
