# Scheduled cloud refresh: runs on GitHub's servers (not your machine), so it works
# even when your computer is off or restarted.
#
# It re-fetches every group, re-translates ONLY the groups whose messages changed,
# commits the updated pages back, and deploys to Pages.
#
# One-time setup — add these repository secrets under
# Settings -> Secrets and variables -> Actions:
#   TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_SESSION, ANTHROPIC_API_KEY
#   (and ANTHROPIC_WORKSPACE_ID if your Anthropic key is not scoped to a workspace)
# Get TELEGRAM_SESSION once by running locally:  uv run translate-bot login
name: Refresh translations

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Fetch changed groups, translate, rebuild
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: uv run translate-bot refresh
      - name: Commit refreshed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site data
          git diff --quiet --cached || git commit -m "Refresh translations [skip ci]"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
